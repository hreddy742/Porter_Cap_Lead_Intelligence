# Staging environment -- completely isolated from the dev setup.
#
#   Dev:     docker-compose.yml          port 5432  volume postgres_data
#   Staging: docker-compose.staging.yml  port 5433  volume postgres_staging_data
#
# The dev database (porter_leads) is never touched by any command in this file.
#
# Usage:
#   Start staging DB only:          docker compose -f docker-compose.staging.yml up db_staging -d
#   Start staging dashboard:        docker compose -f docker-compose.staging.yml up dashboard_staging -d
#   Stop all staging services:      docker compose -f docker-compose.staging.yml down
#   Destroy staging DB (data loss):  docker compose -f docker-compose.staging.yml down -v
#
# Run migrations and the pipeline manually against staging -- see docs/STAGING.md.

services:
  db_staging:
    image: postgres:16
    environment:
      POSTGRES_DB: porter_leads_staging
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porter -d porter_leads_staging"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard_staging:
    build: .
    env_file: .env.staging
    depends_on:
      db_staging:
        condition: service_healthy
    ports:
      - "8502:8501"
    volumes:
      - .:/app
    command: streamlit run app/dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_staging_data:
