[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porter-leads"
version = "0.1.0"
description = "Porter Capital internal lead intelligence system"
requires-python = ">=3.12"
dependencies = [
    # Database
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9",

    # Validation
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",

    # HTTP
    "httpx>=0.27",

    # Logging / monitoring
    "structlog>=24.0",
    "sentry-sdk>=2.0",

    # Fuzzy matching (review only — never auto-merge)
    "rapidfuzz>=3.0",

    # Dashboard
    "streamlit>=1.35",

    # Utilities
    "python-dotenv>=1.0",
    "tenacity>=8.0",      # retry logic
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",          # linting
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "db: marks tests that require a real PostgreSQL database (via testcontainers)",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*", "scripts*"]
